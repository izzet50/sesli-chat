<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sesli Chat</title>
<style>
body{background:#111;color:#fff;font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:#222;padding:30px;border-radius:15px;text-align:center;width:90%;max-width:400px}
input{padding:10px;width:200px;border:none;border-radius:8px;margin:10px 0}
button{padding:10px 20px;border:none;border-radius:8px;background:#4c6ef5;color:#fff;cursor:pointer}
#room{display:none}
</style>
</head>
<body>
<div class="box" id="join">
<h1>🎤 Sesli Chat</h1>
<input id="roomName" placeholder="Oda adı">
<br>
<button onclick="joinRoom()">Odaya Katıl</button>
</div>
<div class="box" id="room">
<h2>Oda: <span id="rName"></span></h2>
<button onclick="leaveRoom()">Odadan Çık</button>
</div>
<script>
let localStream;
function joinRoom(){
const name=document.getElementById('roomName').value;
if(!name)return alert('Oda adı yaz');
document.getElementById('join').style.display='none';
document.getElementById('room').style.display='block';
document.getElementById('rName').innerText=name;
navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{localStream=s;}).catch(()=>{});
}
function leaveRoom(){
if(localStream)localStream.getTracks().forEach(t=>t.stop());
document.getElementById('room').style.display='none';
document.getElementById('join').style.display='block';
}
</script>
</body>
</html>
