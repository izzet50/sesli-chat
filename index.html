
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sesli Chat Odaları</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎤 Sesli Chat Odaları</h1>
        <div id="room-select">
            <input type="text" id="roomName" placeholder="Oda adı gir...">
            <button id="joinBtn">Odaya Katıl</button>
        </div>
        <div id="chat-area" style="display:none;">
            <h2 id="currentRoom"></h2>
            <div id="users"></div>
            <button id="leaveBtn">Odadan Çık</button>
            <button id="micBtn">🎤 Konuş</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
